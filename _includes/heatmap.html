{%- comment -%}
  Writing heatmap on the home page, drawn by assets/js/heatmap.js from this
  list of published posts. Locked posts only expose what the blog already
  shows (date/time), labelled "잠긴 글".
{%- endcomment -%}
<section class="heatmap" aria-label="글쓰기 기록" hidden>
  <script type="application/json" class="heatmap-data">[
  {%- for post in site.posts -%}
    {%- if post.locked -%}
      {%- assign label = "잠긴 글" -%}
    {%- elsif post.kind == "review" -%}
      {%- assign label = post.work -%}
    {%- elsif post.auto_title -%}
      {%- if post.kind == "memo" -%}{%- assign label = "메모" -%}{%- else -%}{%- assign label = "일기" -%}{%- endif -%}
    {%- else -%}
      {%- assign label = post.title -%}
    {%- endif -%}
    {"d":{{ post.date | date: "%Y-%m-%d" | jsonify }},"t":{{ post.date | date: "%H:%M" | jsonify }},"u":{{ post.url | relative_url | jsonify }},"l":{{ label | jsonify | replace: "</", "<\/" }}}{% unless forloop.last %},{% endunless %}
  {%- endfor -%}
  ]</script>
</section>
<script src="{{ '/assets/js/heatmap.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
